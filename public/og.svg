  <!-- phi partition hairlines -->
  <g stroke="#FFB000" stroke-width="2" opacity="0.18" fill="none">
    <line x1="742" y1="0" x2="742" y2="630"/>
    <line x1="742" y1="389" x2="1200" y2="389"/>
    <line x1="1020" y1="389" x2="1020" y2="630"/>
  </g>
  <!-- big spiral arcs, amber -->
  <g fill="none" stroke="#FFB000" stroke-width="18" stroke-linecap="square">
    <path d="M 60 60 A 435 435 0 0 0 495 495" transform="scale(0.72) translate(30,40)"/>
    <path d="M 940 320 A 268 268 0 0 1 672 52" transform="translate(0,40)"/>
